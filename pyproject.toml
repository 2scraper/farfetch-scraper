[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "farfetch-scraper"
version = "0.4.3"
description = "A working scraper for farfetch.com listing pages — category, hub, search and brand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "2Captcha" }]

# Kept identical to requirements.txt on purpose — that file, not this one, is
# what the README tells a new clone to run first, so a change to one has to be
# mirrored in the other by hand. CI's byte-compile + smoke_test.py steps only
# install requirements.txt, so a drift here would go unnoticed there too.
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/2scraper/farfetch-scraper"

# Console scripts, so `pip install .[playwright]` produces a real command
# instead of a directory you have to cd into and invoke with `python3`.
#
# The prefix is the repo name, not a bare `scrape`: these install onto a PATH
# shared with everything else the user has, and a generic name there is worse
# than a long one. Each engine gets its own command rather than one command
# with an --engine flag, because the engines have DIFFERENT dependencies and
# only one of them is expected to be installed (see the extras above) — a
# dispatcher would import a driver that is deliberately absent.
#
# `python3 playwright_scraper.py ...` keeps working exactly as before and is
# still what the README documents; this is an addition, not a replacement.
# The module layout is unchanged too: this is a flat collection of scripts,
# and turning it into a package namespace would rewrite every documented
# invocation, every import, the Dockerfile and both workflows, to move a
# prefix around. The console scripts are the part that was actually missing.
[project.scripts]
farfetch-scraper = "cli_entry:playwright"
farfetch-scraper-playwright = "cli_entry:playwright"
farfetch-scraper-selenium = "cli_entry:selenium"
farfetch-scraper-puppeteer = "cli_entry:puppeteer"
farfetch-scraper-api = "scraper_api_client:main"
farfetch-scraper-diff = "diff_runs:main"
farfetch-scraper-fingerprint = "fingerprint_client:main"
farfetch-scraper-env = "env_config:main"

# Mirrors requirements-playwright.txt / requirements-puppeteer.txt /
# requirements-selenium.txt. Install exactly one — see those files for why:
# playwright and pyppeteer pin incompatible pyee versions, pyppeteer and
# selenium collide on urllib3. `pip install .[playwright]` etc. is equivalent
# to `pip install -r requirements.txt -r requirements-playwright.txt`.
[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]
puppeteer = ["pyppeteer>=1.0.2"]
selenium = ["selenium>=4.15.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
# This repo is a flat collection of standalone scripts, not a package
# directory — list them explicitly rather than relying on setuptools'
# flat-layout auto-discovery, which refuses to guess among this many
# top-level modules. smoke_test.py is excluded on purpose: it is a runner
# invoked as a script (see CONTRIBUTING.md), not a module an installed
# dependency would import.
py-modules = [
    "arg_types",
    "captcha_solver",
    "cli_entry",
    "diff_runs",
    "env_config",
    "fingerprint_client",
    "output_writer",
    "playwright_scraper",
    "product_parser",
    "proxy_pool",
    "puppeteer_scraper",
    "scraper_api_client",
    "selenium_scraper",
]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
# smoke_test.py is a self-contained runner, not a pytest suite (see
# CONTRIBUTING.md for why) — tests/test_smoke.py wraps it as a single pytest
# test so `pytest` works as an entry point without maintaining two copies of
# the same ~90 checks. Scoped to tests/ so pytest doesn't also try, and fail,
# to collect the engine scripts and product_parser.py as test modules.
testpaths = ["tests"]
