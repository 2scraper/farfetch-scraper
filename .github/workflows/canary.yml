name: canary

# tests.yml (deliberately) never touches farfetch.com — see its own header
# comment for why. That leaves a real gap: a selector or JSON-LD shape change
# on the site itself only shows up when a user hits it and files an issue, and
# the offline badge stays green throughout. This workflow is the other half —
# a real run, on a real category URL, on a schedule — so a site-side break is
# caught here first.
#
# Uses no 2Captcha product and no secret by default: the README's own claim is
# that an ordinary browser on a clean IP clears Akamai without one, and this
# workflow is exactly the place that claim gets exercised continuously. GitHub
# Actions runners are datacenter IPs, though, not the "clean residential IP"
# the README measured against — so a red run here can mean either the site
# changed (a real break) or this run's IP got a challenge Akamai didn't give a
# residential one (see the exit-code breakdown in the run summary below). If
# this proves too noisy in practice, set the FARFETCH_PROXY repo secret and
# uncomment the --proxy line to run it from a residential exit instead.
on:
  schedule:
    # Once a day, off the hour, so it isn't competing with everyone else's
    # on-the-hour cron jobs for runner availability.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Scrape a real, known-good category page
        id: run
        # Same filtered category URL the README and TROUBLESHOOTING.md use as
        # the known-good example throughout — chosen so a 0-result run here
        # means either the site changed or the category itself is gone, not
        # "this URL never had products" (see README: a bare hub URL always
        # returns 0 and that is not a bug).
        #
        # --pages 3, not 1: with one page, pagination is never exercised at
        # all, so a renamed next-page attribute (or the ?page= fallback
        # breaking) would stay invisible here — which is precisely the kind
        # of silent decay this workflow exists to catch. Three pages is
        # enough to cross the page boundary twice while keeping the daily
        # request count trivial.
        # continue-on-error: this step's exit code is read explicitly below
        # so the interpretation (parser break vs. probable IP block) can be
        # printed before the job is failed, rather than just going red with
        # no context in the log.
        #
        # set +e: GitHub Actions runs `run:` steps as `bash -e ...` by
        # default, so without this the scraper exiting non-zero would abort
        # the script on THAT line and `echo "exit_code=$?"` below would never
        # run at all — continue-on-error only stops the STEP from failing
        # the job, it does not touch the shell's own errexit behaviour.
        # Confirmed live: under `bash -e`, a script that exits 4 mid-run never
        # reaches a later `echo` line.
        continue-on-error: true
        run: |
          set +e
          python3 playwright_scraper.py \
            --url "https://www.farfetch.com/shopping/kids/girls-clothing-4/items.aspx" \
            --pages 3 --out canary_run --dump-html canary_run.html
            # --proxy "${{ secrets.FARFETCH_PROXY }}"   # uncomment once the secret is set
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the exit code
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0)   echo "OK — products parsed from a live run." ;;
            3)   echo "::error::Blocked before parsing (exit 3), a bot-check/challenge page. Possibly this runner's IP rather than a site change — see FARFETCH_PROXY in this workflow's header comment." ;;
            4)   echo "::error::Ran fine but parsed 0 products (exit 4) on a URL known to have some — this is the shape a real site-side break takes." ;;
            124) echo "::error::Self-imposed timeout (exit 124) — the page never became ready." ;;
            *)   echo "::error::Unexpected exit code $code (see the step above for the traceback)." ;;
          esac
          test "$code" = "0"

      - name: Sanity-check the scraped data
        # Exit 0 only means "some products were written" — it says nothing
        # about whether the run actually rendered, e.g. a snapshot taken
        # before prices load would still write rows, just with every price
        # null. Runs only when the step above passed (code 0), since there is
        # nothing to check on a blocked/empty run.
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          PAGES_REQUESTED = 3
          # A single page of this category has returned ~96 products on every
          # measured run, so three pages should comfortably clear this. The
          # floor guards against a near-empty render, and is deliberately far
          # below the real figure rather than tracking it.
          MIN_PRODUCTS = 120
          rows = json.loads(Path("canary_run.json").read_text())
          meta = json.loads(Path("canary_run.meta.json").read_text())

          fail = []
          if len(rows) < MIN_PRODUCTS:
              fail.append(f"only {len(rows)} products, expected at least {MIN_PRODUCTS} "
                          f"across {PAGES_REQUESTED} pages")

          priced = sum(1 for r in rows if r.get("price") is not None)
          if rows and priced / len(rows) < 0.9:
              fail.append(f"only {priced}/{len(rows)} rows have a non-null price — "
                          f"looks like a snapshot taken before prices rendered")

          # The point of running more than one page: catch pagination dying.
          # `no_new_products` after a single page means the next-page link AND
          # the ?page= fallback both failed to reach new content.
          if meta.get("pages_completed", 0) < PAGES_REQUESTED:
              fail.append(f"pagination stopped after {meta.get('pages_completed')} of "
                          f"{PAGES_REQUESTED} pages (stop_reason="
                          f"{meta.get('stop_reason')!r}) — the next-page selector or "
                          f"the ?page= fallback has probably broken")
          if meta.get("status") != "complete":
              fail.append(f"run status is {meta.get('status')!r}, not 'complete'")

          dom_confirmed = sum(1 for r in rows if r.get("price_source") == "jsonld+dom")
          if rows and dom_confirmed / len(rows) < 0.5:
              fail.append(f"only {dom_confirmed}/{len(rows)} rows had their price "
                          f"confirmed against a rendered tile — discounted rows may "
                          f"carry pre-promo prices")

          for line in fail:
              print(f"::error::{line}")
          sys.exit(1 if fail else 0)
          EOF

      - name: Upload run artifacts (output, HTML snapshot, debug dumps)
        # Always, not just on failure: a run that returns the WRONG number of
        # products with no error is exactly the kind of regression that needs
        # the actual bytes the parser saw, not just a pass/fail badge.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-run-${{ github.run_id }}
          path: |
            canary_run.json
            canary_run.csv
            canary_run.meta.json
            canary_run.html*
            canary_run_page*_debug.*
          if-no-files-found: ignore
          retention-days: 14
