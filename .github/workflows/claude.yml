name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Installed here, from the STABLE channel, instead of letting the action
      # fetch `latest` for itself. On 2026-09-08 `latest` was 2.1.265 and its
      # native install left no binary where the action looks, so every run
      # died with:
      #     Claude Code native binary not found at /home/runner/.local/bin/claude
      # This repo's last green run installed 2.1.263; the sibling
      # amazon-scraper hit the regression first and the failure was reproduced
      # on a re-run there. `stable` was 2.1.236 and is upstream's own
      # known-good pointer, so this pins away from the broken release WITHOUT
      # hardcoding a version: when upstream promotes a newer stable, this
      # picks it up with no edit here.
      #
      # Remove both this step and path_to_claude_code_executable once `latest`
      # installs correctly again.
      - name: Install Claude Code (stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          "$HOME/.local/bin/claude" --version
          # Through GITHUB_ENV, not `${{ env.HOME }}`: HOME is a runner
          # variable and is not in the workflow `env` context, so the
          # expression form expands to an empty string and the action falls
          # back to installing `latest` — the very thing this step exists to
          # avoid, and silently.
          echo "CLAUDE_BIN=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

