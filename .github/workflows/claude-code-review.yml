name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Installed here, from the STABLE channel, instead of letting the action
      # fetch `latest` for itself. On 2026-09-08 `latest` was 2.1.265 and its
      # native install left no binary where the action looks, so every run
      # died with:
      #     Claude Code native binary not found at /home/runner/.local/bin/claude
      # This repo's last green run installed 2.1.263; the sibling
      # amazon-scraper hit the regression first and the failure was reproduced
      # on a re-run there. `stable` was 2.1.236 and is upstream's own
      # known-good pointer, so this pins away from the broken release WITHOUT
      # hardcoding a version: when upstream promotes a newer stable, this
      # picks it up with no edit here.
      #
      # Remove both this step and path_to_claude_code_executable once `latest`
      # installs correctly again.
      - name: Install Claude Code (stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          "$HOME/.local/bin/claude" --version
          # Through GITHUB_ENV, not `${{ env.HOME }}`: HOME is a runner
          # variable and is not in the workflow `env` context, so the
          # expression form expands to an empty string and the action falls
          # back to installing `latest` — the very thing this step exists to
          # avoid, and silently.
          echo "CLAUDE_BIN=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

